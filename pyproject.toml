[project]
name = "chatctl"
version = "0.1.0"
description = "Selectively bulk-archive old ChatGPT conversations, safely."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Ruff's long-standing defaults plus import sorting, pinned explicitly so
# results do not change when a new ruff release alters its default rule set.
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
